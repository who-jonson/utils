name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      - name: Verify tag matches package versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("node:fs");
            const expected = process.env.TAG.replace(/^v/, "");
            let failed = false;
            for (const dir of fs.readdirSync("packages")) {
              const file = `packages/${dir}/package.json`;
              if (!fs.existsSync(file)) continue;
              const { name, version } = JSON.parse(fs.readFileSync(file, "utf8"));
              if (version !== expected) {
                console.error(`${name}: version ${version} does not match tag ${process.env.TAG}`);
                failed = true;
              }
            }
            if (failed) process.exit(1);
            console.log(`All packages match ${expected}`);
          '

      - name: Derive npm dist-tag
        id: dist-tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          tag="latest"
          if [[ "$version" == *-* ]]; then
            id="${version#*-}"
            id="${id%%.*}"
            if [[ -z "$id" || "$id" =~ ^[0-9]+$ ]]; then
              id="next"
            fi
            tag="$id"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish to npm (trusted publishing)
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: pnpm -r publish --access public --no-git-checks --tag "$DIST_TAG"

  changelog:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
