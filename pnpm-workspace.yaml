packages:
  - packages/*

allowBuilds:
  '@parcel/watcher': false
  core-js: false
  esbuild: false

catalog:
  # Build & bundling tools
  '@rollup/plugin-typescript': ^12.3.0
  '@testing-library/vue': ^8.1.0
  '@types/fs-extra': ^11.0.4
  '@types/is-glob': ^4.0.4
  '@types/minimist': ^1.2.5

  # Type definitions
  '@types/node': latest
  '@types/throttle-debounce': ^5.0.2
  '@vitejs/plugin-vue': ^6.0.8
  '@vitest/ui': ^4.1.10
  '@whoj/eslint-config': ^9.2.0-beta.0

  # Dev utilities
  bumpp: ^12.2.0
  c8: ^12.0.0

  # Runtime utilities
  change-case: ^5.4.4
  core-js: ^3.50.0
  cross-env: ^10.1.0
  dot-prop: ^10.2.0
  esbuild: ^0.28.1
  esbuild-register: ^3.6.0

  # Linting
  eslint: ^10.8.1
  eslint-plugin-testing-library: ^7.16.2
  esno: ^4.8.0
  fast-glob: ^3.3.3
  'fuse.js': ^7.0.0
  is-glob: ^4.0.3
  minimist: ^1.2.8
  npm-run-all: ^4.1.5
  nuxt: ^4.5.2
  php-serialize: ^5.0.1
  postcss: ^8.5.26
  rimraf: ^6.1.3
  rollup: ^4.62.4
  rollup-plugin-dts: ^6.5.1
  rollup-plugin-esbuild: ^6.2.1
  rollup-plugin-node-externals: ^9.0.1
  rollup-plugin-postcss: ^4.0.2
  scule: ^1.3.0
  throttle-debounce: ^5.0.2
  tsup: ^8.5.1
  tsx: ^4.23.11

  # TypeScript tooling
  "@typescript/native": "npm:typescript@^7.0.2"
  typescript: "npm:@typescript/typescript6@^6.0.2"
  unbuild: ^3.6.1
  unplugin: ^3.3.0
  vite: ^8.2.1
  vite-plugin-dts: ^5.0.3

  # Testing
  vitest: ^4.1.10

  # Framework (Vue 3)
  vue: ^3.5.41
  vue-router: ^5.2.0
  vue-tsc: ^3.3.9
  fs-extra: ^11.4.0

catalogMode: strict

cleanupUnusedCatalogs: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - core-js
  - esbuild

peerDependencyRules:
  allowAny:
    - rollup
    - typescript
  ignoreMissing:
    - rollup
    - webpack
    - '@vue/compiler-sfc'

shamefullyHoist: true
