packages:
  - packages/*

allowBuilds:
  '@parcel/watcher': false
  core-js: false
  esbuild: false

catalog:
  # Build & bundling tools
  '@rollup/plugin-typescript': ^12.3.1
  '@testing-library/vue': ^8.1.0
  '@types/fs-extra': ^11.0.4
  '@types/is-glob': ^4.0.4
  '@types/minimist': ^1.2.5

  # Type definitions
  '@types/node': latest
  '@types/throttle-debounce': ^5.0.2
  '@vitejs/plugin-vue': ^6.0.10
  '@vitest/ui': ^5.1.0
  '@whoj/eslint-config': ^9.2.0

  # Dev utilities
  bumpp: ^12.3.0
  c8: ^12.0.0

  # Runtime utilities
  change-case: ^5.4.4
  core-js: ^3.51.0
  cross-env: ^10.1.0
  dot-prop: ^10.2.0
  esbuild: ^0.28.2
  esbuild-register: ^3.6.0

  # Linting
  eslint: ^10.14.0
  eslint-plugin-testing-library: ^7.16.2
  esno: ^4.8.0
  fast-glob: ^3.3.3
  'fuse.js': ^7.5.0
  is-glob: ^4.0.3
  minimist: ^1.2.8
  npm-run-all: ^4.1.5
  nuxt: ^4.6.4
  php-serialize: ^5.1.3
  postcss: ^8.5.32
  rimraf: ^6.1.4
  rollup: ^4.68.2
  rollup-plugin-dts: ^6.5.1
  rollup-plugin-esbuild: ^6.2.1
  rollup-plugin-node-externals: ^9.0.1
  rollup-plugin-postcss: ^4.0.2
  scule: ^1.3.0
  throttle-debounce: ^5.0.2
  tsup: ^9.0.0
  tsx: ^4.23.15

  # TypeScript tooling
  "@typescript/native": "npm:typescript@^7.0.2"
  typescript: "npm:@typescript/typescript6@^6.0.2"
  unbuild: ^3.6.1
  unplugin: ^3.7.0
  vite: ^8.3.7
  vite-plugin-dts: ^5.1.2

  # Testing
  vitest: ^5.1.0

  # Framework (Vue 3)
  vue: ^3.5.45
  vue-router: ^5.4.0
  vue-tsc: ^3.3.14
  fs-extra: ^11.4.1

catalogMode: strict

cleanupUnusedCatalogs: true

minimumReleaseAgeExclude:
  - '@rolldown/binding-android-arm-eabi@1.2.18'
  - '@rolldown/binding-android-arm64@1.2.18'
  - '@rolldown/binding-darwin-arm64@1.2.18'
  - '@rolldown/binding-darwin-x64@1.2.18'
  - '@rolldown/binding-freebsd-x64@1.2.18'
  - '@rolldown/binding-linux-arm-gnueabihf@1.2.18'
  - '@rolldown/binding-linux-arm64-gnu@1.2.18'
  - '@rolldown/binding-linux-arm64-musl@1.2.18'
  - '@rolldown/binding-linux-ppc64-gnu@1.2.18'
  - '@rolldown/binding-linux-s390x-gnu@1.2.18'
  - '@rolldown/binding-linux-x64-gnu@1.2.18'
  - '@rolldown/binding-linux-x64-musl@1.2.18'
  - '@rolldown/binding-openharmony-arm64@1.2.18'
  - '@rolldown/binding-win32-arm64-msvc@1.2.18'
  - '@rolldown/binding-win32-x64-msvc@1.2.18'
  - '@rollup/rollup-android-arm-eabi@4.68.2'
  - '@rollup/rollup-android-arm64@4.68.2'
  - '@rollup/rollup-android-x64@4.68.2'
  - '@rollup/rollup-darwin-arm64@4.68.2'
  - '@rollup/rollup-darwin-x64@4.68.2'
  - '@rollup/rollup-freebsd-arm64@4.68.2'
  - '@rollup/rollup-freebsd-x64@4.68.2'
  - '@rollup/rollup-linux-arm-gnueabihf@4.68.2'
  - '@rollup/rollup-linux-arm-musleabihf@4.68.2'
  - '@rollup/rollup-linux-arm64-gnu@4.68.2'
  - '@rollup/rollup-linux-arm64-musl@4.68.2'
  - '@rollup/rollup-linux-loong64-gnu@4.68.2'
  - '@rollup/rollup-linux-loong64-musl@4.68.2'
  - '@rollup/rollup-linux-ppc64-gnu@4.68.2'
  - '@rollup/rollup-linux-ppc64-musl@4.68.2'
  - '@rollup/rollup-linux-riscv64-gnu@4.68.2'
  - '@rollup/rollup-linux-riscv64-musl@4.68.2'
  - '@rollup/rollup-linux-s390x-gnu@4.68.2'
  - '@rollup/rollup-linux-x64-gnu@4.68.2'
  - '@rollup/rollup-linux-x64-musl@4.68.2'
  - '@rollup/rollup-openbsd-x64@4.68.2'
  - '@rollup/rollup-openharmony-arm64@4.68.2'
  - '@rollup/rollup-win32-arm64-msvc@4.68.2'
  - '@rollup/rollup-win32-ia32-msvc@4.68.2'
  - '@rollup/rollup-win32-x64-gnu@4.68.2'
  - '@rollup/rollup-win32-x64-msvc@4.68.2'
  - rolldown@1.2.18
  - rollup@4.68.2
  - vite@8.3.7

onlyBuiltDependencies:
  - '@parcel/watcher'
  - core-js
  - esbuild

peerDependencyRules:
  allowAny:
    - rollup
    - typescript
  ignoreMissing:
    - rollup
    - webpack
    - '@vue/compiler-sfc'

shamefullyHoist: true
